name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-player:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write # Draft preview downloads if Actions artifact storage is full.
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows executable
        run: ./build.ps1 -SkipSmokeTest
      - name: Package and extract deliverable
        run: |
          Compress-Archive -Path publish/FullLengthPlayer-win-x64/* -DestinationPath publish/FullLengthPlayer-win-x64.zip
          Expand-Archive publish/FullLengthPlayer-win-x64.zip -DestinationPath 'publish/launch test'
      - name: Verify packaged executable on Windows
        run: ./scripts/smoke-window.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Verify composition, playback and protected HLS
        run: ./scripts/smoke-playback.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Probe live public YouTube extraction
        run: ./scripts/probe-youtube.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Upload verified application
        id: application
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: FullLengthPlayer-win-x64
          path: publish/FullLengthPlayer-win-x64.zip
          if-no-files-found: error
      - name: Draft preview download if artifact storage is unavailable
        if: steps.application.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/rebuild/mpv-milestone-0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'milestone-10-preview-' + '${{ github.sha }}'.Substring(0, 12)
          gh release create $tag 'publish/FullLengthPlayer-win-x64.zip' --draft --target '${{ github.sha }}' --title 'Milestone 10 commentary replay — Windows test build' --notes 'Windows tests passed. Adds H commentary replay, Shift+scroll volume over videos, opposite-edge reaction anchoring and a 60-second audio search radius. This draft is for user testing; milestone 10 is not yet accepted.'
          if ($LASTEXITCODE -ne 0) { throw 'Draft download creation failed.' }
      - name: Collect startup diagnostics
        if: always()
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $logs = Join-Path $env:LOCALAPPDATA 'FullLengthPlayer/logs'
          if (Test-Path $logs) { Get-ChildItem $logs -File | ForEach-Object { Get-Content $_.FullName; Copy-Item $_.FullName "test-results/$($_.Name).txt" } }
      - name: Upload launch and playback evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: window-launch-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.txt
          if-no-files-found: error
