name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-player:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows executable
        run: ./build.ps1 -SkipSmokeTest
      - name: Package and extract deliverable
        run: |
          Compress-Archive -Path publish/FullLengthPlayer-win-x64/* -DestinationPath publish/FullLengthPlayer-win-x64.zip
          Expand-Archive publish/FullLengthPlayer-win-x64.zip -DestinationPath 'publish/launch test'
      - name: Verify packaged executable on Windows
        run: ./scripts/smoke-window.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Verify embedded MPV playback
        run: ./scripts/smoke-playback.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Upload verified application
        uses: actions/upload-artifact@v4
        with:
          name: FullLengthPlayer-win-x64
          path: publish/FullLengthPlayer-win-x64.zip
          if-no-files-found: error
      - name: Upload launch and playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-launch-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.txt
          if-no-files-found: error
