name: Public readiness scan
on:
  push:
    branches: [audit/public-readiness]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched history without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --max-time 120 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --report-format json --report-path "$RUNNER_TEMP/secret-report.json" > "$RUNNER_TEMP/scan-output.txt" 2>&1
          result=$?
          set -e
          python - <<'PY'
          import json, os
          path=os.path.join(os.environ["RUNNER_TEMP"],"secret-report.json")
          if os.path.exists(path):
              findings=json.load(open(path))
              print("Secret scan findings:",len(findings))
              for item in findings:
                  print(json.dumps({k:item.get(k) for k in ("RuleID","File","StartLine","Commit")}))
          else:
              print("Scanner did not produce a report.")
          PY
          echo "History commits checked: $(git rev-list --all --count)"
          exit "$result"
