name: Build Windows

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-player:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write # Publish versioned ZIPs only after Windows verification.
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows executable
        run: ./build.ps1 -SkipSmokeTest
      - name: Package and extract deliverable
        run: |
          Compress-Archive -Path publish/FullLengthPlayer-win-x64/* -DestinationPath publish/FullLengthPlayer-win-x64.zip
          Expand-Archive publish/FullLengthPlayer-win-x64.zip -DestinationPath 'publish/launch test'
      - name: Verify packaged executable on Windows
        run: ./scripts/smoke-window.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Verify composition, playback and protected HLS
        run: ./scripts/smoke-playback.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Probe live public YouTube extraction
        run: ./scripts/probe-youtube.ps1 -Executable './publish/launch test/FullLengthPlayer.exe'
      - name: Upload verified application
        id: application
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: FullLengthPlayer-win-x64
          path: publish/FullLengthPlayer-win-x64.zip
          if-no-files-found: error
      - name: Publish numbered releases after verification
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/milestone-15')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -Commit '${{ github.sha }}'
      - name: Collect startup diagnostics
        if: always()
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $logs = Join-Path $env:LOCALAPPDATA 'FullLengthPlayer/logs'
          if (Test-Path $logs) { Get-ChildItem $logs -File | ForEach-Object { Get-Content $_.FullName; Copy-Item $_.FullName "test-results/$($_.Name).txt" } }
          Get-ChildItem 'test-results/*.ui-*.png' | ForEach-Object { Write-Host "UI_IMAGE:$($_.Name):$([Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName)))" }
      - name: Upload launch and playback evidence
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: window-launch-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/*.txt
          if-no-files-found: error
