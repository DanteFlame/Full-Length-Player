name: Inspect icon originals
on:
  push:
    paths: ['.github/workflows/inspect-icons.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Expand-Archive -LiteralPath 'FLP icons.zip' -DestinationPath 'icon-originals'
          Get-ChildItem icon-originals -Recurse -Filter '*.png' | Where-Object { $_.FullName -notmatch '__MACOSX' } | ForEach-Object {
            $b = [Drawing.Bitmap]::new($_.FullName)
            $alpha = @{}
            for ($y=0; $y -lt $b.Height; $y+=8) { for ($x=0; $x -lt $b.Width; $x+=8) { $a=$b.GetPixel($x,$y).A; $alpha["$a"]=1 } }
            $preview = [Drawing.Bitmap]::new(160,160)
            $g=[Drawing.Graphics]::FromImage($preview)
            $g.Clear([Drawing.Color]::FromArgb(45,45,45))
            $g.DrawImage($b,0,0,160,160)
            $m=[IO.MemoryStream]::new()
            $preview.Save($m,[Drawing.Imaging.ImageFormat]::Png)
            Write-Host ('ICON_INFO:' + (@{name=$_.Name; path=$_.FullName.Substring((Get-Location).Path.Length+1); width=$b.Width; height=$b.Height; alphaMin=($alpha.Keys | ForEach-Object {[int]$_} | Measure-Object -Minimum).Minimum; alphaMax=($alpha.Keys | ForEach-Object {[int]$_} | Measure-Object -Maximum).Maximum; preview=[Convert]::ToBase64String($m.ToArray())} | ConvertTo-Json -Compress))
            $m.Dispose();$g.Dispose();$preview.Dispose();$b.Dispose()
          }
